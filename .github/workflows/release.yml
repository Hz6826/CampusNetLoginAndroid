name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build debug APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          # compileSdk 37 可能还在预览通道，稳定通道失败时回退到预览通道。
          install_sdk() {
            sdkmanager "$@" || sdkmanager --channel=3 "$@"
          }
          install_sdk "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/XJTUNetLoginAndroid-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true
          body: |
            Android 客户端 ${{ github.ref_name }}。

            当前 CI 产物为 **debug 签名** 的 APK，仅用于测试；正式分发前请使用自己的签名密钥重新构建。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
