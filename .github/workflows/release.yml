name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect beta tag
        id: tag
        run: |
          if [[ "${GITHUB_REF_NAME,,}" == *beta* ]]; then
            echo "beta=true" >> "$GITHUB_OUTPUT"
            echo "Beta tag: build debug APK and mark release as prerelease"
          else
            echo "beta=false" >> "$GITHUB_OUTPUT"
            echo "Stable tag: build signed release APK"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install SDK packages
        run: |
          set -e
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # compileSdk 37 可能还在预览通道，稳定通道失败时回退到预览通道。
          install_sdk() {
            "$SDKMANAGER" "$@" || "$SDKMANAGER" --channel=3 "$@"
          }
          install_sdk "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        if: steps.tag.outputs.beta != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: steps.tag.outputs.beta != 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease

      - name: Build debug APK for beta
        if: steps.tag.outputs.beta == 'true'
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug

      - name: Prepare artifact
        run: |
          set -e
          mkdir -p dist
          if [[ "${{ steps.tag.outputs.beta }}" == "true" ]]; then
            cp app/build/outputs/apk/debug/app-debug.apk \
              "dist/XJTUNetLoginAndroid-${GITHUB_REF_NAME}-debug.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk \
              "dist/XJTUNetLoginAndroid-${GITHUB_REF_NAME}.apk"
          fi
          ls -la dist

      - name: Verify release APK signature
        if: steps.tag.outputs.beta != 'true'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --print-certs dist/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.tag.outputs.beta == 'true' }}
          body: |
            Android 客户端 ${{ github.ref_name }}。

            - `beta` 标签：构建 debug 签名 APK，并作为 prerelease 发布，仅供测试。
            - 正式标签：构建 release 签名 APK。

      - name: Bump versionCode on main
        run: |
          set -e
          git fetch origin main
          git checkout -B main origin/main
          CURRENT=$(sed -n 's/^versionCode=//p' version.properties | head -n 1)
          NEXT=$((CURRENT + 1))
          sed -i "s/^versionCode=.*/versionCode=$NEXT/" version.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): bump versionCode to $NEXT [skip ci]"
          git push origin main
