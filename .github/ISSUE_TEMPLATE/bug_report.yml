name: Bug 报告
description: 报告一个可复现的问题
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索是否已有相同 issue，并确认使用的是最新构建。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 issues，没有重复
          required: true
        - label: 我使用的是最新版本（或已说明版本号）
          required: true

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置页「关于」里的版本号，或构建时间 / commit
      placeholder: 例如 v1.0 (2026-11-01)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 例如 Xiaomi 17 / HyperOS 3 / Android 17
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: 网络环境
      options:
        - 校园网 Wi-Fi
        - 其他 Wi-Fi
        - 移动数据
        - 无网络
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开应用
        2. 点击 ...
        3. 出现 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 运行记录 / 错误信息
      description: 可复制应用内「运行记录」页内容；请先打码账号、密码、IP 等敏感信息
      render: text

  - type: textarea
    id: extra
    attributes:
      label: 截图 / 录屏 / 补充信息
