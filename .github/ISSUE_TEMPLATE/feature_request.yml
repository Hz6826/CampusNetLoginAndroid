name: 功能建议
description: 提出一个新功能或改进建议
labels: [ enhancement ]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请尽量说明使用场景，而不是只描述实现方式。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / 使用场景
      placeholder: 例如：每次连接校园网后都要手动打开应用查看状态……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      placeholder: 你希望应用怎么表现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      placeholder: 有没有其他做法？为什么不用？

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 截图、参考链接等；如果是其他项目的做法也欢迎说明
